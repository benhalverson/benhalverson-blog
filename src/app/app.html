<div class="shell">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" routerLink="/" aria-label="Ben Halverson home">
        <span class="brand__eyebrow">Ben Halverson</span>
        <span class="brand__title">Notes on Angular, TypeScript, and shipping calmly</span>
      </a>

      <div class="site-header__actions">
        <nav aria-label="Primary">
          <ul class="nav-list">
            @for (item of navItems; track item.href) {
              <li>
                <a
                  class="nav-link"
                  [routerLink]="item.href"
                  routerLinkActive="nav-link--active"
                  [routerLinkActiveOptions]="item.exact ? exactMatchOptions : subsetMatchOptions"
                >
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </nav>

        <button
          type="button"
          class="theme-toggle"
          (click)="theme.toggle()"
          [attr.aria-pressed]="theme.isDark()"
          [attr.aria-label]="themeToggleLabel()"
        >
          <span aria-hidden="true">{{ theme.isDark() ? 'Light' : 'Dark' }}</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="site-main">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>Writing-focused Angular blog with Markdown content and server rendering.</p>
      <a href="https://github.com/benhalverson" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</div>
